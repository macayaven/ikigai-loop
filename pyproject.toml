[project]
name = "ikigai-loop"
version = "0.1.0"
description = "Two objective profiles, one signal stream, two diverging apps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "pillow>=13.0.0",
]

[project.scripts]
verify-claims = "framework.verify.__main__:main"
try-ikigai = "framework.tryit.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
]
app = [
    "inspect-ai",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.uv]
default-groups = ["dev", "app"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
typeCheckingMode = "standard"
strict = ["framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
